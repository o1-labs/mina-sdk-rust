[package]
name = "mina-sdk"
version = "0.4.0-rc.2"
edition = "2021"
license = "Apache-2.0"
description = "Rust SDK for interacting with Mina Protocol nodes via GraphQL"
repository = "https://github.com/MinaProtocol/mina-sdk-rust"
homepage = "https://github.com/MinaProtocol/mina-sdk-rust"
documentation = "https://docs.rs/mina-sdk"
readme = "README.md"
authors = ["Mina Protocol <engineering@minaprotocol.com>"]
keywords = ["mina", "blockchain", "graphql", "cryptocurrency", "web3"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
exclude = [".github/", "tests/integration_tests.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native-tls"]
# TLS for `https://` endpoints, from the system's OpenSSL (or the platform's
# TLS library on macOS and Windows).
native-tls = ["reqwest/default-tls"]
# TLS from rustls with the Mozilla root certificates: no OpenSSL to build or
# link. Use with `default-features = false`.
rustls-tls = ["reqwest/rustls-tls"]
# Client for the daemon's ITN GraphQL server (`--itn-graphql-port`), whose
# requests are signed with an ed25519 key. See `mina_sdk::itn`.
itn = ["dep:ed25519-dalek", "dep:base64", "dep:getrandom", "tokio/sync"]

[dependencies]
# reqwest's default features without its TLS: the features above choose it
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
ed25519-dalek = { version = "3", optional = true }
base64 = { version = "0.23", optional = true }
getrandom = { version = "0.2", optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
rand = "0.10"

[[example]]
name = "itn_internal_logs"
required-features = ["itn"]
