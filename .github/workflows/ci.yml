name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run unit tests
        run: cargo test --lib --tests -- --skip integration

      - name: Run unit tests (all features)
        run: cargo test --all-features --lib --tests -- --skip integration

  spec:
    name: Specification copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read spec/VERSION
        id: spec
        run: echo "version=$(cat spec/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check out mina-sdk-spec at that tag
        uses: actions/checkout@v7
        with:
          repository: o1-labs/mina-sdk-spec
          ref: ${{ steps.spec.outputs.version }}
          path: .mina-sdk-spec

      - name: Check that spec/ is the tag's copy
        run: .mina-sdk-spec/scripts/sync.sh --check .

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: >
          cargo tarpaulin --all-features --lib --test client_tests
          --test itn_client_tests --test common_api_tests
          --out lcov --skip-clean
          --exclude-files 'examples/*'
          --exclude-files 'tests/*'

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          fail-on-error: true
